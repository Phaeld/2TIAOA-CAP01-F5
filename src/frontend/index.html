<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CardioIA - Cardiology Conversational Assistant developed for FIAP."
    >

    <title>CardioIA — Cardiology Assistant</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <div class="app">

        <!-- Application header -->
        <header class="header">

            <div class="header-title">

                <span
                    class="logo"
                    aria-hidden="true"
                >
                    ❤️
                </span>

                <div>
                    <h1>CardioIA</h1>

                    <p class="subtitle">
                        Intelligent Cardiology Assistant
                    </p>
                </div>

            </div>

            <span
                id="status-badge"
                class="badge badge-offline"
                title="Backend connection status"
            >
                Checking...
            </span>

        </header>


        <!-- Medical disclaimer -->
        <p
            class="disclaimer"
            role="note"
        >
            ⚠️ This is an educational prototype
            <strong>(FIAP — Phase 5)</strong>.
            It <strong>does not replace professional medical care</strong>.
            In an emergency, call <strong>SAMU at 192</strong>.
        </p>


        <!-- Conversation area -->
        <main
            id="chat"
            class="chat"
            aria-live="polite"
            aria-label="Conversation with the assistant"
        >
        </main>


        <!-- Message input -->
        <form
            id="chat-form"
            class="composer"
            autocomplete="off"
        >

            <input
                id="chat-input"
                type="text"
                placeholder="Type your message..."
                aria-label="Message to the assistant"
                maxlength="500"
                required
            >

            <button
                id="send-btn"
                type="submit"
                aria-label="Send message"
            >
                Send
            </button>

        </form>


        <footer class="footer">
            CardioIA Project · Phase 5 · Part 2 —
            User Interaction Interface
        </footer>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
